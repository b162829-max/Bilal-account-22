
name: Build Driver Accounts APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Project ZIP
        run: |
          mkdir -p android-project
          unzip -q DriverAccounts_GitHub_Ready.zip -d android-project

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find android-project -name settings.gradle -type f | head -n 1)")
          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Android project structure not found"
            exit 1
          fi
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Accounts-APK
          path: app-debug.apk
