
name: Build Driver Accounts APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Project ZIP
        run: |
          mkdir -p android-project
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d android-project

      - name: Build APK
        run: |
          PROJECT_FILE=$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace
          APK_FILE=$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi
          cp "$APK_FILE" app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Accounts-APK
          path: app-debug.apk
